<!DOCTYPE html>
<html lang="fr">
<head>

    .header {

      font-size: 26px;
      font-weight: 600;
    }
    .header p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }
    .dashboard {
      width: 100%;
      height: calc(100vh - 100px);

      background: #fff;

      height: 100%;
      border: 0;
      display: block;

    @media (max-width: 700px) {
